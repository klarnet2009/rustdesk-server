# Kerberos config for the RustDesk web panel SPNEGO acceptor (iterum.lv domain).
# Non-secret: realm + KDC only. The service keytab is supplied separately at
# runtime (KRB5_KTNAME). Discovered from AD RootDSE on 10.21.1.2 (2026-07-22).
[libdefaults]
    default_realm = ITERUM.LOCAL
    dns_lookup_kdc = false
    dns_lookup_realm = false

[realms]
    ITERUM.LOCAL = {
        kdc = 10.21.1.2
    }

[domain_realm]
    .iterum.lv = ITERUM.LOCAL
    rustdesk.iterum.lv = ITERUM.LOCAL
    .iterum.local = ITERUM.LOCAL
    iterum.local = ITERUM.LOCAL
