version: '3.8'

networks:
  rustdesk-net:
    external: false
  coolify:
    external: true

services:
  hbbs:
    container_name: hbbs
    build:
      context: .
      dockerfile: Dockerfile.build
    ports:
      - "21115:21115"
      - "21116:21116"
      - "21116:21116/udp"
    # ВАЖНО: замените "rustdesk.вашдомен.com" на ваш реальный домен!
    command: hbbs -r rustdesk.вашдомен.com:21117
    volumes:
      - ./data:/root
    networks:
      - rustdesk-net
    depends_on:
      - hbbr
    restart: unless-stopped

  hbbr:
    container_name: hbbr
    build:
      context: .
      dockerfile: Dockerfile.build
    ports:
      - "21117:21117"
    command: hbbr
    volumes:
      - ./data:/root
    networks:
      - rustdesk-net
    restart: unless-stopped
