version: '3.8'

networks:
  rustdesk-net:
    external: false
  coolify:
    external: true

services:
  hbbs:
    container_name: hbbs
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "21115:21115"
      - "21116:21116"
      - "21116:21116/udp"
    # ВАЖНО: замените "rustdesk.вашдомен.com" на ваш реальный домен!
    command: hbbs -r rustdesk.вашдомен.com:21117
    volumes:
      - ./data:/root
    networks:
      - rustdesk-net
    depends_on:
      - hbbr
    restart: unless-stopped

  hbbr:
    container_name: hbbr
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "21117:21117"
    command: hbbr
    volumes:
      - ./data:/root
    networks:
      - rustdesk-net
    restart: unless-stopped

  web-panel:
    container_name: rustdesk-web-panel
    build:
      context: ./web_panel
      dockerfile: Dockerfile
    # В Coolify для веб-сервисов лучше использовать expose вместо ports
    expose:
      - "21114"
    environment:
      - API_HOST=0.0.0.0
      - API_PORT=21114
      - SSL_ENABLED=false
      # Kerberos SSO (ACTIVE): keytab at ./data/web_panel/rustdesk.keytab on the
      # host -> /app/data/rustdesk.keytab in the container. SSO_SPN pins the SPN
      # the acceptor validates against (public, not a secret).
      - KRB5_KTNAME=/app/data/rustdesk.keytab
      - SSO_SPN=HTTP/rustdesk.iterum.lv
    volumes:
      - ./data/web_panel:/app/data
    networks:
      - rustdesk-net
      - coolify
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=coolify"
      - "traefik.http.services.rustdesk-web-panel.loadbalancer.server.port=21114"
    depends_on:
      - hbbs
    restart: unless-stopped
